[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-folderview"
version = "0.1.2"
description = "Folder-tree view of IP prefixes for NetBox — collapsible hierarchy, per-prefix IP browsing, filter-aware."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
dependencies = []
license = "MIT"
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/averyhabbott/netbox-folderview"
Repository = "https://github.com/averyhabbott/netbox-folderview"

[[project.authors]]
name = "Avery Abbott"

[[project.authors]]
email = "averyhabbott@yahoo.com"

[tool.setuptools.packages.find]
where = ["."]
include = ["netbox_folderview*"]

[tool.setuptools.package-data]
netbox_folderview = ["templates/**/*"]
