[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-folderview"
version = "0.2.0"
description = "NetBox plugin: folder-tree prefix browser and user-defined Catalogs for organizing any NetBox object type into hierarchical folders."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
dependencies = []
license = "MIT"
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/averyhabbott/netbox-folderview"
Repository = "https://github.com/averyhabbott/netbox-folderview"
Changelog = "https://github.com/averyhabbott/netbox-folderview/blob/main/CHANGELOG.md"

[[project.authors]]
name = "Avery Abbott"

[[project.authors]]
email = "averyhabbott@yahoo.com"

[tool.setuptools.packages.find]
where = ["."]
include = ["netbox_folderview*"]

[tool.setuptools.package-data]
netbox_folderview = ["templates/**/*"]
