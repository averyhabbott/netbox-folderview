[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-folderview"
dynamic = ["version"]
description = "NetBox plugin: folder-tree prefix browser and user-defined Catalogs for organizing any NetBox object type into hierarchical folders."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []
keywords = ["netbox", "netbox-plugin", "plugin", "ipam", "prefix", "catalog", "folder", "tree"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]

[[project.authors]]
name = "Avery Abbott"
email = "averyhabbott@yahoo.com"

[[project.maintainers]]
name = "Avery Abbott"
email = "averyhabbott@yahoo.com"

[project.urls]
Homepage = "https://github.com/averyhabbott/netbox-folderview"
Source = "https://github.com/averyhabbott/netbox-folderview"
Issues = "https://github.com/averyhabbott/netbox-folderview/issues"
Changelog = "https://github.com/averyhabbott/netbox-folderview/blob/main/CHANGELOG.md"

[project.entry-points."netbox.plugins"]
netbox_folderview = "netbox_folderview"

[tool.setuptools.dynamic]
version = { attr = "netbox_folderview.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["netbox_folderview*"]
exclude = ["netbox_folderview.tests*"]

[tool.setuptools.package-data]
netbox_folderview = ["templates/**/*.html"]
